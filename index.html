<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Персональне портфоліо — незабаром."
    />
    <title>Portfolio — незабаром</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #f7f1ff;
        background: #16132c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 20rem;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 10%, #4b3e8c 0, transparent 26rem),
          radial-gradient(circle at 88% 88%, #1e6971 0, transparent 28rem),
          #16132c;
      }

      .page {
        width: min(100% - 2rem, 70rem);
        margin: 0 auto;
        padding: 1.25rem 0 3rem;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 1.25rem;
        background: rgb(22 19 44 / 72%);
        box-shadow: 0 1.25rem 3.75rem rgb(6 5 23 / 24%);
        backdrop-filter: blur(1rem);
      }

      .brand {
        padding: 0.5rem 0.75rem;
        color: #fff5d5;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-decoration: none;
      }

      nav ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      nav button {
        padding: 0.55rem 0.75rem;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 0.75rem;
        color: inherit;
        background: rgb(255 255 255 / 8%);
        font: inherit;
        font-size: 0.875rem;
        cursor: pointer;
      }

      nav button:hover,
      nav button:focus-visible {
        border-color: #f7ca8c;
        outline: none;
        background: #f7ca8c;
        color: #292044;
      }

      main {
        display: grid;
        grid-template-columns: 1fr minmax(16rem, 0.85fr);
        align-items: center;
        gap: clamp(2rem, 7vw, 6rem);
        padding: clamp(3.5rem, 10vw, 7rem) clamp(0.25rem, 3vw, 2rem) 1rem;
      }

      .eyebrow {
        display: inline-flex;
        margin: 0 0 1rem;
        padding: 0.4rem 0.7rem;
        border: 1px solid rgb(247 202 140 / 40%);
        border-radius: 999px;
        color: #ffe0ae;
        background: rgb(247 202 140 / 10%);
        font-size: 0.875rem;
        font-weight: 700;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(3rem, 8vw, 6.25rem);
        line-height: 0.94;
        letter-spacing: -0.065em;
      }

      .intro {
        max-width: 33rem;
        margin: 1.5rem 0 0;
        color: #d5cce5;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .art-card {
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 1.5rem;
        background: #0f1834;
        box-shadow: 0 1.5rem 3rem rgb(5 5 22 / 35%);
      }

      .art-card img {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
      }

      @media (max-width: 48rem) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        nav ul {
          justify-content: flex-start;
        }

        main {
          grid-template-columns: 1fr;
          padding-top: 4rem;
        }

        .art-card {
          width: min(100%, 32rem);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="brand" href="/portfolio/">Portfolio</a>
        <nav aria-label="Основна навігація">
          <ul>
            <li><button type="button">Button 1</button></li>
            <li><button type="button">Button 2</button></li>
            <li><button type="button">Button 3</button></li>
            <li><button type="button">Button 4</button></li>
            <li><button type="button">Button 5</button></li>
          </ul>
        </nav>
      </header>

      <main>
        <section aria-labelledby="page-title">
          <p class="eyebrow">Сайт у процесі створення</p>
          <h1 id="page-title">Portfolio</h1>
          <p class="intro">
            Тут незабаром з’являться вибрані роботи, досвід і спосіб зв’язатися зі мною.
          </p>
        </section>

        <figure class="art-card">
          <img
            src="hero-pixel-art.png"
            width="640"
            height="640"
            alt="Піксельний нічний пейзаж із місяцем над озером"
          />
        </figure>
      </main>
    </div>
  </body>
</html>
